<div class="page-container">
  <div class="form-wrapper">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <button
        pButton
        type="button"
        class="back-button"
        icon="pi pi-arrow-left"
        label="Înapoi"
        (click)="goBack()"
      ></button>

      <h2>Admitere Liceu</h2>

      <label for="county">Județ</label>
      <select id="county" formControlName="county">
        @for (c of counties; track c.value) {
        <option [value]="c.value">{{ c.label }}</option>
        }
      </select>

      <label for="year">An</label>
      <select id="year" formControlName="year" [disabled]="!years.length">
        <option [ngValue]="null" disabled selected>Selectează anul</option>
        @for (year of years; track year) {
        <option [ngValue]="year">{{ year }}</option>
        }
      </select>

      <label for="grade">Notă</label>
      <p-inputNumber
        id="grade"
        formControlName="grade"
        [min]="1"
        [max]="10"
        mode="decimal"
        inputStyleClass="custom-input"
      ></p-inputNumber>

      <label for="delimiter">Delimitator (opțional)</label>
      <p-inputNumber
        id="delimiter"
        formControlName="delimiter"
        inputStyleClass="custom-input"
      ></p-inputNumber>

      <button
        pButton
        type="submit"
        label="Calculează"
        [disabled]="form.invalid"
        class="submit-button"
      ></button>

      <button
        pButton
        type="button"
        label="Vezi clasamentul"
        (click)="goToRanker()"
        class="ranker-button"
      ></button>
    </form>
  </div>

  <div class="card-section">
    <div class="card-section-wrapper">
      <h3>Specializări posibile:</h3>

      @if (specializationGroups.length > 0) {
      <div class="card-container">
        @for (spec of specializationGroups; track spec) {
        <app-school-card [specialization]="spec"></app-school-card>
        }
      </div>
      } @else {
      <p class="no-results">
        Completează formularul pentru a vedea opțiunile disponibile.
      </p>
      }
    </div>
  </div>
</div>
